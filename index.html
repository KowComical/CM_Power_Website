<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CM Power</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static_site/vendor/semantic.min.css">
  <link rel="stylesheet" href="tools/style.css">
  <link rel="stylesheet" href="static_site/styles.css?v=20260809-8">
</head>
<body>
  <aside class="sidebar">
    <img class="brand-logo" src="tools/logo_edited.png" alt="CM Power">

    <nav class="tab-list" aria-label="Dashboard views">
      <button class="tab-button is-active" type="button" data-tab="overview">Overview</button>
      <button class="tab-button" type="button" data-tab="line">Daily Trends</button>
      <button class="tab-button" type="button" data-tab="stacked" hidden>Generation Mix</button>
      <button class="tab-button" type="button" data-tab="scatter">IEA Compare</button>
      <button class="tab-button" type="button" data-tab="map">Global Map</button>
    </nav>

    <section class="control-group">
      <label for="energySelect">Energy Type</label>
      <select id="energySelect"></select>
    </section>

    <section class="control-group" data-filter="continent">
      <label for="continentSelect">Region</label>
      <select id="continentSelect"></select>
    </section>

    <section class="control-group" data-filter="stacked">
      <label for="stackedSelect">Sort By</label>
      <select id="stackedSelect"></select>
    </section>

    <label class="toggle-row" data-filter="details">
      <input id="detailsToggle" type="checkbox">
      <span>Show details</span>
    </label>

    <a class="download-link" href="data/data_for_download.csv.gz" download>
      Download compressed data
    </a>
  </aside>

  <main class="workspace">
    <header class="page-header">
      <div>
        <p class="eyebrow">CM Power Database</p>
        <h1 id="pageTitle">Overview</h1>
      </div>
      <p id="statusText" class="status-text">Ready</p>
    </header>

    <section id="overviewPanel" class="panel is-active" data-panel="overview">
      <div id="scorecardContainer" class="scorecard-shell"></div>
    </section>

    <section id="linePanel" class="panel chart-panel" data-panel="line">
      <div id="lineChart" class="chart"></div>
    </section>

    <section id="stackedPanel" class="panel chart-panel" data-panel="stacked" hidden>
      <div id="stackedChart" class="chart"></div>
    </section>

    <section id="scatterPanel" class="panel chart-panel" data-panel="scatter">
      <h2 class="scatter-chart-heading">CM Power and IEA Generation Comparison (TWh)</h2>
      <div id="scatterMeta" class="chart-note"></div>
      <div id="scatterLegend" class="scatter-legend" role="group" aria-label="Filter IEA comparison by region"></div>
      <div id="scatterChart" class="chart"></div>
    </section>

    <section id="mapPanel" class="panel chart-panel map-panel" data-panel="map">
      <header class="map-editorial-header">
        <div class="map-title-block">
          <p class="map-kicker">Daily Electricity Atlas</p>
          <h2><span id="mapEnergyLabel">Total</span> generation by country</h2>
          <p id="mapCoverageNote" class="map-note">-</p>
        </div>
        <dl class="map-summary-list">
          <div>
            <dt>Date</dt>
            <dd id="mapDateValue">-</dd>
          </div>
          <div>
            <dt>Coverage</dt>
            <dd><span id="mapCountryCount">-</span> countries</dd>
          </div>
          <div>
            <dt>Combined</dt>
            <dd id="mapTotalValue">-</dd>
          </div>
        </dl>
      </header>
      <div id="mapChart" class="chart map-chart">
        <div id="mapTooltip" class="map-tooltip" role="tooltip" hidden>
          <div id="mapTooltipCountry" class="map-tooltip-country">-</div>
          <div id="mapTooltipDate" class="map-tooltip-date">-</div>
          <div class="map-tooltip-row">
            <span id="mapTooltipMetric">Generation</span>
            <strong id="mapTooltipValue">-</strong>
          </div>
        </div>
      </div>
      <div class="map-scale" aria-label="Color scale from lower to higher daily generation">
        <span>Lower output</span>
        <span class="map-scale-ramp" aria-hidden="true"></span>
        <span>Higher output</span>
      </div>
      <div class="map-timeline">
        <div class="map-timeline-heading">
          <span>Explore daily history</span>
          <output id="mapDateLabel" for="mapDateSlider">-</output>
        </div>
        <label class="map-date-control" for="mapDateSlider">
          <span id="mapDateStart">-</span>
          <input id="mapDateSlider" type="range" min="0" max="0" value="0" step="1">
          <span id="mapDateEnd">-</span>
        </label>
      </div>
    </section>
  </main>

  <script src="static_site/vendor/d3.min.js?v=7.9.0"></script>
  <script src="static_site/vendor/topojson-client.min.js?v=3.1.0"></script>
  <script src="static_site/vendor/echarts.min.js?v=6.1.0"></script>
  <script src="static_site/app.js?v=20260829-1"></script>
</body>
</html>
